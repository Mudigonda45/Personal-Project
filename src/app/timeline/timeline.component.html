<section class="experience-section">
  <div class="experience-shell">
    <div class="section-heading">
      <span>Professional Journey</span>
      <h2>Work Experience</h2>
      <p>Hands-on full stack and frontend development experience across enterprise applications and client-focused websites.</p>
    </div>

    <div class="experience-timeline">
      <article class="experience-item" *ngFor="let experience of experiences">
        <div class="timeline-marker">
          <i class="fa-solid fa-briefcase" aria-hidden="true"></i>
        </div>

        <div class="experience-card">
          <div class="experience-header">
            <div>
              <h3>{{ experience.role }}</h3>
              <p>{{ experience.company }}<span *ngIf="experience.location"> | {{ experience.location }}</span></p>
            </div>

            <span class="period">{{ experience.period }}</span>
          </div>

          <ul>
            <li *ngFor="let point of experience.points">{{ point }}</li>
          </ul>
        </div>
      </article>
    </div>
  </div>
</section>
